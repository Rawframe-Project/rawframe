# The one producer of `trusted_ci` evidence.
#
# ADR-0082 makes this file, on the protected ref, the only thing whose signature
# can raise a record above `diagnostic_untrusted`. Nothing in here grants trust:
# it runs the corpus, collects what the tool recorded, and asks GitHub to sign a
# statement binding those exact bytes to this workflow, this commit, this ref, and
# this run. Whether that signature means anything is decided later, offline, by
# `rf-evidence` against the pinned Sigstore root. A run of this workflow from a
# branch, a fork, or a different entry point produces an attestation that fails
# verification, which is the intended outcome rather than a gap.
#
# It is reusable so that the identity which signs stays constant while entry
# points change. A reusable workflow's provenance records the entry point in
# `externalParameters.workflow` and the workflow that signed in
# `runDetails.builder.id`, and the verifier anchors both.
#
# Every third-party action is pinned by full commit SHA. A tag is a name its
# owner can move, and an action that can change after review is an unreviewed
# action.
name: Trusted verification

on:
  workflow_call:

permissions: {}

jobs:
  # The Linux container host, pinned by digest because ADR-0083 makes the digest
  # the host's operating-system identity.
  #
  # The Windows lane is absent rather than approximated. Every available Windows
  # container base is Server 2025 build 26100, whose inbox curl is 8.16.0, and
  # the locked bootstrap transport record for `windows-x86_64` requires 8.19.0 or
  # later because it was measured on a 26200 workstation. The record admits one
  # transport per host ID and the schema fixes the count at two, so a container
  # entry cannot be added without a decision that belongs to the project owner.
  # Writing a Windows job that cannot pass Stage 0, or quietly lowering a floor
  # that protects the workstation lane, would both be worse than saying so here.
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the commit under verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The locked artifacts are 4.7 GiB of bytes whose identity is fixed by the
      # locks, so refetching them on every run buys nothing. Restoring them is
      # safe because nothing here trusts the cache: Stage 1 verifies every object
      # against its locked size and SHA-256 before use, and a cache entry that
      # disagreed would be refetched and refused, not believed.
      #
      # The key is the locks themselves, so a change to any locked identity
      # produces a different cache and never a stale hit. There is deliberately
      # no `restore-keys`: a prefix match would hand this run the artifacts of a
      # different locked closure, and although Stage 1 would refuse every object
      # that disagreed, the run would then pay a full refetch on top of a full
      # restore. A miss is cheaper than a wrong hit, so a miss is what a changed
      # lock produces.
      #
      # The 12 GiB prepared LLVM tree is not cached. The reason is the runner's
      # 14 GiB of disk before the cache limit is even reached: the tree plus the
      # artifacts it was expanded from does not fit alongside a build. Trimming
      # it is real work with a real risk of silently discarding something
      # clang-tidy needs, so it belongs to its own Task rather than to this one.
      - name: Restore the verified artifact cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/cache
            out/bootstrap
          key: rf-linux-artifacts-${{ hashFiles('third_party/artifacts.lock.json', 'third_party/toolchain.lock.json', 'third_party/vcpkg/**', 'cmake/bootstrap/**') }}

      # The first attempt at caching reported a saved cache and saved nothing:
      # the container writes as root, and `tar` could not read the trees it had
      # to archive. A cache that silently does not work looks exactly like one
      # that does, and the only difference is in the timings nobody was reading,
      # so what the cache actually did is recorded here instead of assumed.
      - name: Report what the cache did
        env:
          CACHE_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          echo "rf: cache key ${CACHE_KEY}"
          echo "rf: exact hit ${CACHE_HIT:-false}"
          for tree in out/cache out/bootstrap; do
            if [ -d "$tree" ]; then
              echo "rf: restored ${tree}, $(du -sh "$tree" | cut -f1)"
            else
              echo "rf: ${tree} was not restored"
            fi
          done

      - name: Sign in to the container registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Run the corpus on the Linux container host
        id: corpus
        uses: ./.github/actions/verify-host
        with:
          host: linux-x86_64
          image: ghcr.io/rawframe-project/rawframe-ci-linux@sha256:ea43b3d191034cb19ac254d45590ac067defaf6aeb3f45ceb1b5d31ce5949c6d

      # Saved from a push to the protected ref and from nowhere else, and saved
      # here rather than at the end of the job so that a later failure in
      # attestation or publication does not discard a closure that was acquired
      # and verified correctly.
      #
      # A cache written by a pull request lives in that pull request's own scope,
      # is evicted with it, and is a tree a contributor influenced. Pull requests
      # read the protected ref's cache and never write one, which is the same
      # asymmetry the trust boundary itself has.
      - name: Save the verified artifact cache
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/cache
            out/bootstrap
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # One subject, the archive of everything the tool recorded. The digest in
      # the statement is not what the verifier believes: it recomputes the digest
      # from these bytes and compares.
      - name: Attest what the run produced
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.corpus.outputs.archive }}

      # The bundle is evidence, not a log line. It is uploaded next to the
      # subject so that verification can be repeated offline against exactly the
      # bytes that were signed.
      - name: Publish the evidence and its bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-verification-linux-x86_64
          path: |
            ${{ steps.corpus.outputs.archive }}
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

      - name: Record what was signed
        env:
          ARCHIVE: ${{ steps.corpus.outputs.archive }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          {
            echo '## Linux container host'
            echo
            echo "subject: \`$(sha256sum "$ARCHIVE" | cut -d' ' -f1)\`"
            echo
            echo "bundle: \`$(sha256sum "$BUNDLE" | cut -d' ' -f1)\`"
            echo
            echo "run: \`${GITHUB_RUN_ID}\` attempt \`${GITHUB_RUN_ATTEMPT}\`"
          } >> "$GITHUB_STEP_SUMMARY"
